<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    .floating { animation: float 5s ease-in-out infinite; }
    .pulsing { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Fondo Negro Elegante -->
  <rect width="800" height="400" fill="#0D1117" rx="10"/>

  <!-- Orbits en Gris Oscuro -->
  <circle cx="400" cy="200" r="160" stroke="#30363D" stroke-width="1" fill="none" stroke-dasharray="10,5"/>
  <circle cx="400" cy="200" r="260" stroke="#30363D" stroke-width="1" fill="none" stroke-dasharray="5,10"/>

  <!-- TypeScript (Negro con borde Blanco) -->
  <g class="floating" style="animation-delay: 0s;">
    <path d="M150,150 L230,150 L270,200 L230,250 L150,250 L110,200 Z" fill="#161B22" stroke="#F0F6FC" stroke-width="2"/>
    <text x="190" y="212" text-anchor="middle" fill="#F0F6FC" font-family="Arial, sans-serif" font-weight="bold" font-size="30">TS</text>
    <text x="190" y="280" text-anchor="middle" fill="#8B949E" font-family="Arial, sans-serif" font-size="14">TypeScript</text>
  </g>

  <!-- Next.js (Negro con borde Blanco) -->
  <g class="floating" style="animation-delay: 1s;">
    <path d="M570,150 L650,150 L690,200 L650,250 L570,250 L530,200 Z" fill="#161B22" stroke="#F0F6FC" stroke-width="2"/>
    <text x="610" y="212" text-anchor="middle" fill="#F0F6FC" font-family="Arial, sans-serif" font-weight="bold" font-size="22">NEXT</text>
    <text x="610" y="280" text-anchor="middle" fill="#8B949E" font-family="Arial, sans-serif" font-size="14">Next.js</text>
  </g>

  <!-- AI (Centro - Destacado en Gris Claro/Blanco) -->
  <g class="pulsing">
    <circle cx="400" cy="200" r="45" fill="#F0F6FC"/>
    <text x="400" y="208" text-anchor="middle" fill="#0D1117" font-family="Arial, sans-serif" font-weight="bold" font-size="24">IA</text>
    <circle cx="400" cy="200" r="55" stroke="#F0F6FC" stroke-width="1" fill="none" opacity="0.3"/>
  </g>
</svg>
