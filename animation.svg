<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .floating { animation: float 4s ease-in-out infinite; }
    .pulsing { animation: pulse 3s ease-in-out infinite; }
    .text { font-family: sans-serif; font-weight: bold; }
  </style>

  <!-- Canvas -->
  <rect width="800" height="400" fill="white"/>

  <!-- Orbits -->
  <ellipse cx="400" cy="200" rx="280" ry="100" stroke="#E2E8F0" stroke-width="1" fill="none" stroke-dasharray="5,5"/>
  <ellipse cx="400" cy="200" rx="220" ry="120" stroke="#E2E8F0" stroke-width="1" fill="none" stroke-dasharray="5,5"/>

  <!-- TypeScript Node -->
  <g class="floating" style="animation-delay: 0s;">
    <path d="M160,150 L240,150 L280,200 L240,250 L160,250 L120,200 Z" fill="#F7F7F7" stroke="#3178C6" stroke-width="2"/>
    <text x="200" y="210" text-anchor="middle" fill="#3178C6" font-size="30" class="text">TS</text>
    <text x="200" y="275" text-anchor="middle" fill="#94A3B8" font-size="12" class="text">TypeScript</text>
  </g>

  <!-- Next.js Node -->
  <g class="floating" style="animation-delay: 1s;">
    <path d="M560,150 L640,150 L680,200 L640,250 L560,250 L520,200 Z" fill="#F7F7F7" stroke="#000000" stroke-width="2"/>
    <text x="600" y="210" text-anchor="middle" fill="#000000" font-size="24" class="text">NEXT</text>
    <text x="600" y="275" text-anchor="middle" fill="#94A3B8" font-size="12" class="text">Next.js</text>
  </g>

  <!-- Central AI Hub -->
  <g class="pulsing">
    <circle cx="400" cy="200" r="40" fill="#1E293B"/>
    <text x="400" y="206" text-anchor="middle" fill="white" font-size="18" class="text">IA</text>
    <circle cx="400" cy="200" r="50" stroke="#1E293B" stroke-width="1" fill="none" opacity="0.3"/>
  </g>
</svg>
