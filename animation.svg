<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      .floating { animation: float 6s ease-in-out infinite; }
      .pulsing { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
      .spinning { animation: spin 40s linear infinite; transform-origin: center; }
      .text { font-family: 'Inter', sans-serif; }
    </style>
  </defs>

  <!-- Fondo Blanco Minimalista -->
  <rect width="800" height="400" fill="#FFFFFF"/>

  <!-- Órbitas Muy Finas -->
  <g class="spinning" transform="translate(400, 200)">
    <circle r="160" stroke="#F1F5F9" stroke-width="1.5" fill="none" stroke-dasharray="10,20"/>
    <circle r="240" stroke="#F8FAFC" stroke-width="1" fill="none" stroke-dasharray="5,15"/>
    <circle cx="160" cy="0" r="4" fill="#000000" opacity="0.1"/>
    <circle cx="-240" cy="0" r="3" fill="#000000" opacity="0.1"/>
  </g>

  <!-- TypeScript Node (Estilo Glassmorphism Blanco/Negro) -->
  <g class="floating" transform="translate(180, 200)">
    <path d="M-50,-70 L50,-70 L90,0 L50,70 L-50,70 L-90,0 Z" fill="#000000"/>
    <text x="0" y="15" text-anchor="middle" fill="#FFFFFF" font-size="35" font-weight="700" class="text">TS</text>
    <text x="0" y="95" text-anchor="middle" fill="#64748B" font-size="12" class="text">TypeScript</text>
  </g>

  <!-- Next.js Node (Estilo Glassmorphism Blanco/Negro) -->
  <g class="floating" transform="translate(620, 200)" style="animation-delay: 1.5s;">
    <path d="M-50,-70 L50,-70 L90,0 L50,70 L-50,70 L-90,0 Z" fill="#000000"/>
    <text x="0" y="12" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700" class="text">NEXT</text>
    <text x="0" y="95" text-anchor="middle" fill="#64748B" font-size="12" class="text">Next.js</text>
  </g>

  <!-- Central IA Hub (Elegante y Minimalista) -->
  <g class="pulsing" transform="translate(400, 200)">
    <circle r="45" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text y="8" text-anchor="middle" fill="#000000" font-size="20" font-weight="700" class="text">IA</text>
    <circle r="55" stroke="#000000" stroke-width="1" fill="none" opacity="0.1"/>
  </g>

</svg>
