<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="400" viewBox="0 0 800 400" xml:space="preserve">
  <style type="text/css">
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .floating { animation: float 6s ease-in-out infinite; }
    .pulsing { 
      animation: pulse 4s ease-in-out infinite; 
      transform-origin: 400px 200px; 
    }
    .text { 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    }
  </style>

  <!-- Background -->
  <rect width="800" height="400" fill="#FFFFFF"/>

  <!-- Orbits -->
  <g transform="translate(400, 200)">
    <g>
      <circle r="160" stroke="#E2E8F0" stroke-width="1.5" fill="none" stroke-dasharray="10,20"/>
      <circle r="240" stroke="#F1F5F9" stroke-width="1" fill="none" stroke-dasharray="5,15"/>
      <circle cx="160" cy="0" r="5" fill="#000000" opacity="0.2"/>
      <circle cx="-240" cy="0" r="4" fill="#000000" opacity="0.2"/>
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0 0 0" 
        to="360 0 0" 
        dur="40s" 
        repeatCount="indefinite" />
    </g>
  </g>

  <!-- TypeScript -->
  <g class="floating">
    <g transform="translate(180, 200)">
      <path d="M-50,-70 L50,-70 L90,0 L50,70 L-50,70 L-90,0 Z" fill="#000000"/>
      <text x="0" y="15" text-anchor="middle" fill="#FFFFFF" font-size="35" font-weight="700" class="text">TS</text>
      <text x="0" y="95" text-anchor="middle" fill="#475569" font-size="14" font-weight="600" class="text">TypeScript</text>
    </g>
  </g>

  <!-- Next.js -->
  <g class="floating" style="animation-delay: 1.5s;">
    <g transform="translate(620, 200)">
      <path d="M-50,-70 L50,-70 L90,0 L50,70 L-50,70 L-90,0 Z" fill="#000000"/>
      <text x="0" y="12" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700" class="text">NEXT</text>
      <text x="0" y="95" text-anchor="middle" fill="#475569" font-size="14" font-weight="600" class="text">Next.js</text>
    </g>
  </g>

  <!-- Center -->
  <g class="pulsing">
    <g transform="translate(400, 200)">
      <circle r="45" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
      <text y="8" text-anchor="middle" fill="#000000" font-size="20" font-weight="700" class="text">IA</text>
      <circle r="55" stroke="#000000" stroke-width="1" fill="none" opacity="0.15"/>
    </g>
  </g>
</svg>
