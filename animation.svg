<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="600" viewBox="0 0 1000 600" xml:space="preserve">
  <defs>
    <!-- Masterpiece Gradients -->
    <linearGradient id="mainStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
    </radialGradient>

    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style type="text/css">
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-25px) rotate(1deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
    .floating { animation: float 6s ease-in-out infinite; }
    .pulsing { animation: pulse 4s ease-in-out infinite; transform-origin: 500px 300px; }
    .rotating { animation: rotate 25s linear infinite; transform-origin: 500px 300px; }
    .text-modern { font-family: 'Inter', 'Segoe UI', sans-serif; letter-spacing: 4px; text-transform: uppercase; }
    .orbit-path { fill: none; stroke-width: 2; filter: url(#neonGlow); opacity: 0.4; }
  </style>

  <!-- Deep Atmospheric Background -->
  <rect width="1000" height="600" rx="50" fill="#020617" stroke="#1E293B" stroke-width="2" />
  
  <!-- Orbital Energy Streams (React Logo Style - Massive & Visible) -->
  <g class="rotating">
    <ellipse cx="500" cy="300" rx="420" ry="180" class="orbit-path" stroke="#38BDF8" stroke-dasharray="5,20" />
    <circle cx="80" cy="300" r="6" fill="#38BDF8" filter="url(#neonGlow)" />
    
    <ellipse cx="500" cy="300" rx="420" ry="180" class="orbit-path" stroke="#C084FC" stroke-dasharray="10,25" style="transform: rotate(60deg); transform-origin: 500px 300px;" />
    <circle cx="80" cy="300" r="6" fill="#C084FC" filter="url(#neonGlow)" style="transform: rotate(60deg); transform-origin: 500px 300px;" />

    <ellipse cx="500" cy="300" rx="420" ry="180" class="orbit-path" stroke="#FDE68A" stroke-dasharray="2,15" style="transform: rotate(-60deg); transform-origin: 500px 300px;" />
    <circle cx="80" cy="300" r="6" fill="#FDE68A" filter="url(#neonGlow)" style="transform: rotate(-60deg); transform-origin: 500px 300px;" />
  </g>

  <!-- Central AI Crystal Core -->
  <g class="pulsing">
    <circle cx="500" cy="300" r="150" fill="url(#coreGlow)" />
    <path d="M500,230 L560,265 L560,335 L500,370 L440,335 L440,265 Z" fill="#0F172A" stroke="#C084FC" stroke-width="5" filter="url(#neonGlow)" />
    <text x="500" y="312" text-anchor="middle" fill="#FFFFFF" font-size="32" font-weight="900" class="text-modern">IA</text>
  </g>

  <!-- TypeScript Glass Card -->
  <g class="floating" style="animation-delay: 0s;">
    <g transform="translate(180, 300)">
      <rect x="-70" y="-60" width="140" height="120" rx="25" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="2" filter="url(#neonGlow)" />
      <rect x="-25" y="-25" width="50" height="50" rx="6" fill="#38BDF8" />
      <text x="5" y="15" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="900" font-family="Arial">TS</text>
      <text x="0" y="85" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="700" class="text-modern">TypeScript</text>
    </g>
  </g>

  <!-- Next.js Glass Card -->
  <g class="floating" style="animation-delay: 2s;">
    <g transform="translate(820, 300)">
      <rect x="-70" y="-60" width="140" height="120" rx="25" fill="#1E293B" fill-opacity="0.8" stroke="#FDE68A" stroke-width="2" filter="url(#neonGlow)" />
      <g transform="translate(0, -5)">
        <circle r="30" fill="#000000" stroke="#FFFFFF" stroke-width="2" />
        <path d="M-12,14 L-12,-14 L12,14 M12,-14 L12,4" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="0" y="85" text-anchor="middle" fill="#94A3B8" font-size="11" font-weight="700" class="text-modern">Next.js</text>
    </g>
  </g>

  <!-- Bottom Branding -->
  <text x="500" y="570" text-anchor="middle" fill="#475569" font-size="14" font-weight="700" class="text-modern">Juan José Guarín Medina • 2026</text>
</svg>
