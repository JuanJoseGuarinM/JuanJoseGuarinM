<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="400" viewBox="0 0 800 400" xml:space="preserve">
  <defs>
    <!-- Desert Night Palette: Blue, Blackish, Sand -->
    <linearGradient id="oasisGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" /> <!-- Cyan Blue -->
      <stop offset="50%" stop-color="#FDE68A" /> <!-- Sand -->
      <stop offset="100%" stop-color="#0EA5E9" /> <!-- Ocean Blue -->
    </linearGradient>

    <radialGradient id="sandGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0" />
    </radialGradient>

    <filter id="neonBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style type="text/css">
    @keyframes rotateOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -100; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    
    .orbit { transform-origin: 400px 200px; opacity: 0.3; stroke-width: 1.5; }
    .orbit-1 { animation: rotateOrbit 20s linear infinite; }
    .orbit-2 { animation: rotateOrbit 25s linear infinite reverse; }
    .orbit-3 { animation: rotateOrbit 30s linear infinite; }
    
    .ia-core { animation: pulse 4s ease-in-out infinite; transform-origin: 400px 200px; }
    .flowing-dash { stroke-dasharray: 10, 20; animation: flow 6s linear infinite; }
    .node-float { animation: float 6s ease-in-out infinite; }
    .text-oasis { font-family: 'Segoe UI', system-ui, sans-serif; letter-spacing: 2px; }
  </style>

  <!-- Blackish Background -->
  <rect width="800" height="400" rx="30" fill="#020617" stroke="#1E293B" stroke-width="2" />
  
  <!-- Subtle Sand Mesh -->
  <circle cx="400" cy="200" r="300" fill="url(#sandGlow)" opacity="0.1" />

  <!-- React Atom Orbits (Blue & Sand) -->
  <g class="orbit orbit-1">
    <ellipse cx="400" cy="200" rx="280" ry="110" fill="none" stroke="#38BDF8" stroke-dasharray="5,15" />
    <circle cx="120" cy="200" r="3" fill="#38BDF8" filter="url(#neonBlue)" />
  </g>
  <g class="orbit orbit-2" style="transform: rotate(60deg); transform-origin: 400px 200px;">
    <ellipse cx="400" cy="200" rx="280" ry="110" fill="none" stroke="#FDE68A" stroke-dasharray="10,10" />
    <circle cx="120" cy="200" r="3" fill="#FDE68A" filter="url(#neonBlue)" />
  </g>
  <g class="orbit orbit-3" style="transform: rotate(-60deg); transform-origin: 400px 200px;">
    <ellipse cx="400" cy="200" rx="280" ry="110" fill="none" stroke="#0EA5E9" stroke-dasharray="2,10" />
    <circle cx="120" cy="200" r="3" fill="#0EA5E9" filter="url(#neonBlue)" />
  </g>

  <!-- Flowing Connection -->
  <path d="M 150 200 Q 275 120, 400 200 T 650 200" 
        fill="none" stroke="url(#oasisGradient)" stroke-width="2.5" opacity="0.5" filter="url(#neonBlue)" class="flowing-dash" />

  <!-- IA CORE -->
  <g class="ia-core">
    <circle cx="400" cy="200" r="90" fill="url(#sandGlow)" opacity="0.2" />
    <circle cx="400" cy="200" r="55" fill="#020617" stroke="#38BDF8" stroke-width="2" filter="url(#neonBlue)" />
    <text x="400" y="212" text-anchor="middle" fill="#FFFFFF" font-size="32" font-weight="900" class="text-oasis">IA</text>
  </g>

  <!-- Tech Nodes -->
  <g class="node-float" style="animation-delay: 0s;">
    <g transform="translate(150, 200)">
      <circle r="42" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" filter="url(#neonBlue)" />
      <text x="0" y="10" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800" class="text-oasis">TS</text>
      <text x="0" y="65" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" class="text-oasis">TYPESCRIPT</text>
    </g>
  </g>

  <g class="node-float" style="animation-delay: 2s;">
    <g transform="translate(650, 200)">
      <circle r="42" fill="#0F172A" stroke="#FDE68A" stroke-width="1.5" filter="url(#neonBlue)" />
      <text x="0" y="8" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="900" class="text-oasis">NEXT</text>
      <text x="0" y="65" text-anchor="middle" fill="#94A3B8" font-size="10" font-weight="700" class="text-oasis">NEXT.JS</text>
    </g>
  </g>

  <!-- Bottom Details -->
  <text x="400" y="375" text-anchor="middle" fill="#334155" font-size="11" font-weight="600" class="text-oasis" opacity="0.7">FULL STACK • AI • PERFORMANCE</text>
</svg>
